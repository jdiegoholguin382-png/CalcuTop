name: Compilar APK CalcuTop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: cp -r resources/android/res/. android/app/src/main/res/
      - run: npx cap sync android
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CalcuTop-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuTop-1.0
          path: CalcuTop-1.0.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0 CalcuTop-1.0.apk --clobber \
          || gh release create v1.0 CalcuTop-1.0.apk --title "CalcuTop 1.0" --notes "Calculadora topográfica de CONSTRUTOP M&T S.A.S"
